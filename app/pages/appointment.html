<main class="main">
  <section class="appointment">
    <div class="container">
      <h1 class="appointment__title title-l4">BOOK AN APPOINTMENT</h2>
      <div class="appointment__inner">
        <div class="appointment__contant">
          <h2 class="appointment__contant-title title-l4">CONTACT INFORMATHION</h2>
          <p class="appointment__contant-text">Fill in your contact details</p>
          <form class="appointment__contant-form" action="">
            <input class="appointment__contant-input" type="text" placeholder="First name">
            <input class="appointment__contant-input" type="text" placeholder="Last name">
            <input class="appointment__contant-input" type="email" placeholder="Email">
            <input class="appointment__contant-input" type="text" placeholder="Mobile">
          </form>
          <button class="appointment__contant-btn" type="submit">SEND</button>
        </div>
        <div class="appointment__box">
          <picture>
          <source srcset="images/appointment.avif" type="image/avif">
          <source srcset="images/appointment.webp" type="image/webp">
          <img class="appointment__box-img" src="images/appointment.jpg" alt="appointment-img">
          </picture>
        </div>
      </div>
    </div>
  </section>
</main>
<!--=include footer.html -->
